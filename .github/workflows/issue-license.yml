name: Лиценз олгох

# Хүсэлт нээгдэх, засагдах, шошго нэмэгдэх бүрд ажиллана. Засагдахад ажиллах нь
# санаатай: дутуу бөглөсөн маягтыг робот буцаадаг тул хүн засаад хадгалахад
# шинээр хүсэлт үүсгэлгүйгээр дахин шалгагдана.
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

# Хямралыг багасгана, ГЭХДЭЭ энэ дангаараа хангалтгүй. Нэг хүсэлт нээгдэхэд
# «opened» ба «labeled» хоёр үйл явдал бараг зэрэг гарах ба хоёр ажиллагаа нэг
# бүртгэлийг уншиж, нэг дугаарыг хоёр удаа олгож байсан. Жинхэнэ дараалал нь
# доорх push-ийн гогцоо — git-ийн ref л атомын шинжтэй.
concurrency:
  group: license-registry
  cancel-in-progress: false

jobs:
  issue:
    if: contains(github.event.issue.labels.*.name, 'license')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Лиценз гаргаж бүртгэх
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZLW_LICENSE_KEY: ${{ secrets.ZLW_LICENSE_KEY }}
          ZLW_ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name  "zenith-license-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ХАРИУГ ЗӨВХӨН ТҮЛХСЭНИЙ ДАРАА БИЧНЭ. Бүртгэлээ түрүүлж түлхэж
          # чадсан ажиллагаа л лиценз олгосон; хожимдсон нь дахин fetch хийж,
          # бүртгэлээс өмнөх лицензийг олоод чимээгүй гарна.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            set +e
            node tools/issue-license.mjs
            code=$?
            set -e

            case $code in
              3) echo "Энэ хүсэлтэд аль хэдийн олгогдсон."; exit 0 ;;
              # Дутуу бөглөсөн маягт бол хэрэглэгчийн алдаа, системийнх биш.
              # Ажиллагааг унагаавал хэн нэг нь и-мэйлээ буруу бичих бүрд
              # эзэмшигч рүү алдааны мэдэгдэл очно — робот үүрэг-ээ гүйцэтгэсэн.
              4) node tools/post-reply.mjs; exit 0 ;;
              0) : ;;
              *) exit $code ;;
            esac

            git add registry.json
            git commit --quiet -m "Лиценз олгов — хүсэлт #${ZLW_ISSUE}"

            if git push --quiet; then
              node tools/post-reply.mjs
              exit 0
            fi

            echo "Push буцаагдав ($attempt/5). Бүртгэл хөдөлсөн байна — дахин уншина."
            sleep $((attempt * 3))
          done

          echo "Таван удаа оролдоод бүртгэлд бичиж чадсангүй."
          exit 1
