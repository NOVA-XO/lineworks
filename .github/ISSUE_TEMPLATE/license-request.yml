name: Лиценз хүсэх
description: Zenith LineWorks-ийн туршилтын лиценз авах
title: "Лиценз хүсэх"
labels: ["license"]
body:
  - type: markdown
    attributes:
      value: |
        Маягтыг бөглөж илгээнэ үү. Түлхүүрийг робот нэг минутын дотор
        энэ хүсэлт дээр хариу бичиж өгнө.

        **Анхаар:** энэ хуудас нийтэд харагдана. Хувийн мэдээллээ
        шаардлагатайгаас илүү бүү бичээрэй.

  - type: input
    id: name
    attributes:
      label: Овог, нэр
      placeholder: Батын Болд
    validations:
      required: true

  - type: input
    id: org
    attributes:
      label: Байгууллага
      description: Нийтийн бүртгэлд энэ нэр харагдана.
      placeholder: Зенит Солар ХХК
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: И-мэйл
      description: Хугацаа дуусах, шинэ хувилбар гарах үед мэдэгдэхэд ашиглана.
      placeholder: ner@жишээ.mn
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Төхөөрөмжийн дугаар (заавал биш)
      description: >
        Лицензийг нэг компьютерт хязгаарлахыг хүсвэл бичнэ. Хоосон орхивол
        лиценз аль ч компьютер дээр хүчинтэй байна. Энэ дугаарыг гаргах
        ZLWLICENSE команд дараагийн хувилбарт орно.
      placeholder: A1B2C3D4E5F60718
    validations:
      required: false

  - type: dropdown
    id: host
    attributes:
      label: Аль Civil 3D дээр ашиглах вэ
      options:
        - Civil 3D 2027
        - Civil 3D 2026
        - Хоёулаа
        - Хараахан суулгаагүй
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Нөхцөл
      options:
        - label: >
            Туршилтын хувилбар нь баталгаагүй бөгөөд гарсан үр дүнг эрх бүхий
            инженер шалгах ёстойг ойлгож байна.
          required: true
